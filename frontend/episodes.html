<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Black Hat vs White Hat</title>
    <meta name="description" content="An episode player for Aegis Vector's measured arms race: each forgery against each defense, with real model answers and real win rates.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f6f0e1;
            --paper-dark: #e9dfc6;
            --ink: #151515;
            --ink-soft: #4a4640;
            --red: #c62828;
            --green: #2e7d32;
            --caption: #fff3b0;
            --panel-border: 4px solid var(--ink);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--paper);
            background-image: radial-gradient(rgba(0,0,0,0.06) 1px, transparent 1.2px);
            background-size: 7px 7px;
            color: var(--ink);
            font-family: "Comic Neue", "Comic Sans MS", system-ui, sans-serif;
            padding: 20px 16px 48px;
        }
        .shell { max-width: 1180px; margin: 0 auto; }
        .site-nav { display: flex; gap: 16px; font-size: 14px; margin-bottom: 10px; font-weight: 700; }
        .site-nav a { color: var(--ink-soft); text-decoration: none; }
        .site-nav a:hover { color: var(--red); text-decoration: underline; }
        h1 {
            font-family: "Bangers", Impact, sans-serif; font-weight: 400; letter-spacing: 0.04em;
            font-size: clamp(40px, 7vw, 76px); margin: 0; line-height: 0.95;
            text-shadow: 3px 3px 0 var(--paper-dark);
        }
        h1 .vs { color: var(--red); font-size: 0.6em; vertical-align: middle; margin: 0 0.2em; }
        h1 .white { color: var(--paper); -webkit-text-stroke: 2px var(--ink); text-shadow: 3px 3px 0 var(--ink); }
        .tagline { font-size: 16px; max-width: 760px; margin: 8px 0 18px; color: var(--ink-soft); }

        /* Scoreboard + controls */
        .bar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .score { display: flex; gap: 10px; align-items: center; font-family: "Bangers", Impact, sans-serif; font-size: 22px; letter-spacing: 0.04em; }
        .tally { border: 3px solid var(--ink); padding: 2px 12px; min-width: 150px; text-align: center; box-shadow: 3px 3px 0 var(--ink); }
        .tally.black { background: var(--ink); color: var(--paper); }
        .tally.white { background: #fff; }
        .tally b { font-size: 26px; }
        .tally.bump { animation: bump 0.5s ease; }
        @keyframes bump { 40% { transform: scale(1.18) rotate(-2deg); } }
        .controls { display: flex; gap: 8px; flex-wrap: wrap; }
        button {
            font-family: "Bangers", Impact, sans-serif; font-size: 18px; letter-spacing: 0.06em;
            background: #fff; color: var(--ink); border: 3px solid var(--ink); padding: 4px 14px; cursor: pointer;
            box-shadow: 3px 3px 0 var(--ink);
        }
        button:hover { background: var(--caption); }
        button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
        button.primary { background: var(--red); color: #fff; }
        button:disabled { opacity: 0.4; cursor: default; }
        #live-model {
            font-family: "Comic Neue", sans-serif; font-weight: 700; font-size: 15px; border: 3px solid var(--ink);
            background: #fff; padding: 4px 6px; box-shadow: 3px 3px 0 var(--ink);
        }
        .live-tag { display: inline-block; background: var(--red); color: #fff; font-family: "Bangers", Impact, sans-serif;
                    letter-spacing: 0.06em; padding: 0 6px; margin-left: 6px; font-size: 0.8em; vertical-align: middle; }
        .thinking::after { content: " ..."; animation: blink 0.8s steps(1) infinite; }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
        .chip {
            font-family: "Bangers", Impact, sans-serif; font-size: 15px; letter-spacing: 0.05em;
            border: 2px solid var(--ink); padding: 2px 10px; background: #fff; cursor: pointer; box-shadow: 2px 2px 0 var(--ink);
        }
        .chip.active { background: var(--caption); }
        .chip.won-black { background: var(--ink); color: var(--paper); }
        .chip.won-white { background: #fff; outline: 2px solid var(--green); outline-offset: -5px; }
        .chip.pending { border-style: dashed; }

        .episode-title {
            font-family: "Bangers", Impact, sans-serif; font-size: 30px; letter-spacing: 0.04em; margin: 4px 0 10px;
        }
        .episode-title small { font-family: "Comic Neue", sans-serif; font-size: 14px; color: var(--ink-soft); letter-spacing: 0; margin-left: 8px; }

        /* Comic strip */
        .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        @media (max-width: 1000px) { .strip { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 560px) { .strip { grid-template-columns: 1fr; } }
        .panel {
            position: relative; background: #fffdf6; border: var(--panel-border); min-height: 360px; overflow: hidden;
            opacity: 0.25; transform: translateY(6px); transition: opacity 0.4s, transform 0.4s;
        }
        .panel.on { opacity: 1; transform: none; }
        .panel .num {
            position: absolute; top: 0; left: 0; background: var(--ink); color: var(--paper); z-index: 4;
            font-family: "Bangers", Impact, sans-serif; font-size: 15px; padding: 1px 8px 2px; letter-spacing: 0.05em;
        }
        .caption {
            position: relative; z-index: 3; margin: 26px 10px 0; background: var(--caption); border: 2px solid var(--ink);
            padding: 6px 8px; font-size: 13.5px; line-height: 1.35; font-weight: 700; min-height: 58px;
        }
        .scene { position: relative; height: 200px; margin-top: 4px; }
        .scene svg { display: block; overflow: visible; }
        .foot { position: relative; z-index: 3; margin: 0 10px 10px; font-size: 12.5px; line-height: 1.35; }

        /* Paper document */
        .doc {
            position: absolute; width: 38px; height: 48px; background: #fff; border: 2px solid var(--ink);
            box-shadow: 2px 2px 0 var(--ink); z-index: 2;
            background-image: repeating-linear-gradient(transparent 0 7px, #9d978c 7px 8px);
            background-size: 70% 100%; background-position: 50% 6px; background-repeat: no-repeat;
        }
        .doc-card {
            background: #fff; border: 2px solid var(--ink); padding: 6px 8px; font-family: "Courier New", monospace;
            font-size: 11.5px; line-height: 1.35; min-height: 64px; box-shadow: 2px 2px 0 var(--ink);
        }
        .cursor::after { content: "▌"; animation: blink 0.8s steps(1) infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Agents */
        .agent { width: 70px; height: 112px; z-index: 2; }
        .agent .leg { transform-box: fill-box; transform-origin: top center; }
        .agent.walk .leg-l { animation: stride 0.36s ease-in-out infinite alternate; }
        .agent.walk .leg-r { animation: stride 0.36s ease-in-out infinite alternate-reverse; }
        .agent.walk .torso { animation: bob 0.36s ease-in-out infinite alternate; }
        @keyframes stride { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
        @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-2px); } }
        .agent .arm { transform-box: fill-box; transform-origin: top center; transition: transform 0.35s; }
        .agent.cheer .arm-l { transform: rotate(150deg); }
        .agent.cheer .arm-r { transform: rotate(-150deg); }
        .agent.cheer { animation: hop 0.5s ease-in-out 3; }
        @keyframes hop { 50% { transform: translateY(-10px); } }
        .agent .hat { transform-box: fill-box; transform-origin: center bottom; transition: transform 0.4s; }
        .agent.sooty .hat { transform: translateY(-16px) rotate(-18deg); }
        .agent.sooty .soot { opacity: 1; }
        .agent .soot { opacity: 0; transition: opacity 0.3s; }

        .puff { position: absolute; width: 90px; height: 90px; z-index: 3; pointer-events: none; }
        .puff circle { fill: #d9d4c7; stroke: var(--ink); stroke-width: 2; transform-box: fill-box; transform-origin: center;
                       transform: scale(0); opacity: 0; }
        .puff.go circle { animation: puff 1.1s ease-out forwards; }
        .puff.go circle:nth-child(2) { animation-delay: 0.08s; }
        .puff.go circle:nth-child(3) { animation-delay: 0.16s; }
        .puff.go circle:nth-child(4) { animation-delay: 0.24s; }
        @keyframes puff { 0% { transform: scale(0); opacity: 1; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
        .boom {
            position: absolute; z-index: 4; font-family: "Bangers", Impact, sans-serif; font-size: 30px; color: var(--red);
            -webkit-text-stroke: 1px var(--ink); transform: scale(0) rotate(-12deg); opacity: 0;
        }
        .boom.go { animation: boom 0.9s cubic-bezier(.2,1.6,.4,1) forwards; }
        @keyframes boom { 0% { transform: scale(0) rotate(-12deg); opacity: 0; } 40% { transform: scale(1.25) rotate(-8deg); opacity: 1; } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }

        /* Props */
        .cabinet .drawer { transition: transform 0.4s; }
        .cabinet.open .drawer-top { transform: translateX(14px); }
        .glow { position: absolute; font-family: "Bangers", Impact, sans-serif; font-size: 18px; z-index: 4; opacity: 0; transition: opacity 0.3s; }
        .glow.on { opacity: 1; }
        .gate-bars { transform: translateY(-120%); transition: transform 0.35s cubic-bezier(.6,0,.9,.4); }
        .gate.down .gate-bars { transform: translateY(0); }
        .gate.down { animation: shake 0.3s 0.3s; }
        @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
        .stamp {
            position: absolute; z-index: 5; border: 3px solid currentColor; padding: 2px 8px; font-family: "Bangers", Impact, sans-serif;
            font-size: 19px; letter-spacing: 0.06em; background: rgba(255,255,255,0.85); transform: scale(3) rotate(-14deg); opacity: 0;
            white-space: nowrap;
        }
        .stamp.red { color: var(--red); }
        .stamp.green { color: var(--green); }
        .stamp.go { animation: stamp 0.45s cubic-bezier(.2,1.4,.5,1) forwards; }
        @keyframes stamp { to { transform: scale(1) rotate(-14deg); opacity: 1; } }
        .beam { position: absolute; z-index: 1; opacity: 0; transition: opacity 0.4s;
                background: linear-gradient(90deg, rgba(255,236,120,0.85), rgba(255,236,120,0)); clip-path: polygon(0 45%, 100% 0, 100% 100%, 0 55%); }
        .beam.on { opacity: 1; }
        .brackets { position: absolute; z-index: 3; font-family: "Courier New", monospace; font-weight: 700; font-size: 13px; opacity: 0; transition: opacity 0.3s; color: #1565c0; }
        .brackets.on { opacity: 1; }

        /* Answer panel */
        .bubble {
            position: relative; z-index: 3; background: #fff; border: 2px solid var(--ink); border-radius: 14px;
            padding: 7px 9px; font-size: 12.5px; line-height: 1.35; margin: 0 10px 8px;
        }
        .bubble.q { margin-top: 26px; font-weight: 700; }
        .bubble.q::after, .bubble.a::after {
            content: ""; position: absolute; width: 14px; height: 14px; background: #fff; border: 2px solid var(--ink);
            border-top: none; border-left: none; transform: rotate(45deg);
        }
        .bubble.q::after { left: 22px; bottom: -9px; }
        .bubble.a::after { right: 30px; top: -9px; transform: rotate(-135deg); }
        .bubble.a.adopted { border-color: var(--red); box-shadow: 0 0 0 2px var(--red); }
        .bot { display: block; margin: 4px auto 6px; width: 64px; height: 58px; }
        .bot .eye { animation: look 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
        @keyframes look { 45%, 55% { transform: scaleY(0.15); } }
        .model-tag { text-align: center; font-size: 11.5px; color: var(--ink-soft); margin-top: -2px; }

        /* Verdict panel */
        .verdict-big { font-family: "Bangers", Impact, sans-serif; font-size: 34px; letter-spacing: 0.03em; text-align: center; margin: 4px 10px 0; line-height: 1; }
        .verdict-big.black { color: var(--ink); }
        .verdict-big.white { color: var(--green); }
        .rate { text-align: center; font-size: 13px; margin: 4px 10px 8px; }
        .rate b { font-size: 18px; }
        .outcome-bar { display: flex; height: 16px; border: 2px solid var(--ink); margin: 0 10px 4px; background: #fff; }
        .outcome-bar span { display: block; height: 100%; width: 0; transition: width 0.9s ease; }
        .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; margin: 0 10px 8px; color: var(--ink-soft); }
        .legend i { display: inline-block; width: 10px; height: 10px; border: 1px solid var(--ink); margin-right: 3px; vertical-align: -1px; }

        .cliff { border: var(--panel-border); background: #fffdf6; padding: 18px; margin-top: 14px; display: none; }
        .cliff.on { display: block; animation: rise 0.5s ease; }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
        .cliff h2 { font-family: "Bangers", Impact, sans-serif; font-weight: 400; font-size: 30px; margin: 0 0 6px; letter-spacing: 0.04em; }
        .fine { font-size: 12.5px; color: var(--ink-soft); margin-top: 18px; max-width: 900px; line-height: 1.45; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
<div class="shell">
    <nav class="site-nav"><a href="/">&larr; Aegis Vector dashboard</a><a href="about.html">About the Creator</a><a href="books.html">Books</a></nav>
    <h1>Black Hat <span class="vs">vs</span> <span class="white">White Hat</span></h1>
    <p class="tagline">An arms race, one move at a time. Every forgery, every defense, every answer, and every win rate below comes from a real run of Aegis Vector's defenses battery, not a script.</p>

    <div class="bar">
        <div class="score">
            <div class="tally black" id="tally-black">Black Hat <b id="score-black">0</b></div>
            <div class="tally white" id="tally-white">White Hat <b id="score-white">0</b></div>
        </div>
        <div class="controls">
            <button class="primary" id="btn-play" onclick="playAll()">Play all</button>
            <button id="btn-replay" onclick="playEpisode(current)">Replay</button>
            <select id="live-model" title="Model for a live run" aria-label="Model for a live run"></select>
            <button id="btn-live" onclick="playLive()" title="Run this episode now against the chosen model">Run live</button>
            <button id="btn-next" onclick="next()">Next &rarr;</button>
        </div>
    </div>
    <div class="chips" id="chips"></div>

    <div class="episode-title" id="ep-title">Loading episodes...</div>
    <div class="strip" id="strip"></div>

    <div class="cliff" id="cliff"></div>

    <p class="fine" id="fine"></p>
</div>

<script>
const API_BASE = location.protocol.startsWith("http") ? "" : "http://localhost:8010";
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = ms => new Promise(r => setTimeout(r, reduced ? 0 : ms));
let EPISODES = [], CLIFF = null, MODELS = [], current = 0, playing = 0;
const score = { black: 0, white: 0 };
const scored = new Set();

// ---- Characters (original designs: wide-brim hat, round lens goggles, trench coat) ----
function agentSVG(kind, cls = "") {
    const body = kind === "black" ? "#151515" : "#fbf8ef";
    const lens = kind === "black" ? "#fbf8ef" : "#151515";
    const band = kind === "black" ? "#c62828" : "#151515";
    return `<svg class="agent ${cls}" viewBox="0 0 100 160" data-kind="${kind}">
      <g class="torso">
        <g class="hat"><ellipse cx="50" cy="38" rx="34" ry="7" fill="${body}" stroke="#151515" stroke-width="3"/>
          <path d="M32 38 V20 Q50 8 68 20 V38 Z" fill="${body}" stroke="#151515" stroke-width="3"/>
          <rect x="32" y="29" width="36" height="6" fill="${band}"/></g>
        <circle cx="50" cy="56" r="17" fill="${body}" stroke="#151515" stroke-width="3"/>
        <circle cx="43" cy="55" r="6" fill="${lens}" stroke="#151515" stroke-width="2.5"/>
        <circle cx="57" cy="55" r="6" fill="${lens}" stroke="#151515" stroke-width="2.5"/>
        <circle cx="45" cy="53" r="1.6" fill="${body}"/><circle cx="59" cy="53" r="1.6" fill="${body}"/>
        <path d="M44 65 Q50 68 56 65" fill="none" stroke="${kind === "black" ? "#fbf8ef" : "#151515"}" stroke-width="2" stroke-linecap="round"/>
        <g class="soot"><circle cx="40" cy="63" r="3" fill="#6b6459"/><circle cx="60" cy="47" r="2.5" fill="#6b6459"/><circle cx="54" cy="67" r="2" fill="#6b6459"/></g>
        <path d="M31 76 L69 76 L77 124 L23 124 Z" fill="${body}" stroke="#151515" stroke-width="3" stroke-linejoin="round"/>
        <path d="M44 76 L50 92 L56 76" fill="none" stroke="${kind === "black" ? "#fbf8ef" : "#151515"}" stroke-width="2"/>
        <line x1="27" y1="104" x2="73" y2="104" stroke="${kind === "black" ? "#fbf8ef" : "#151515"}" stroke-width="2.5"/>
        <path class="arm arm-l" d="M33 80 L22 108" stroke="#151515" stroke-width="7" stroke-linecap="round"/>
        <path class="arm arm-r" d="M67 80 L78 108" stroke="#151515" stroke-width="7" stroke-linecap="round"/>
      </g>
      <g class="leg leg-l"><line x1="40" y1="124" x2="38" y2="148" stroke="#151515" stroke-width="7" stroke-linecap="round"/><ellipse cx="34" cy="150" rx="8" ry="4" fill="#151515"/></g>
      <g class="leg leg-r"><line x1="60" y1="124" x2="62" y2="148" stroke="#151515" stroke-width="7" stroke-linecap="round"/><ellipse cx="66" cy="150" rx="8" ry="4" fill="#151515"/></g>
    </svg>`;
}
const cabinetSVG = `<svg class="cabinet" viewBox="0 0 70 110" style="width:62px;height:98px">
    <rect x="3" y="3" width="64" height="104" fill="#d8d0bd" stroke="#151515" stroke-width="3"/>
    <g class="drawer drawer-top"><rect x="9" y="10" width="52" height="28" fill="#efe8d6" stroke="#151515" stroke-width="2.5"/><rect x="28" y="20" width="14" height="5" fill="#151515"/></g>
    <g class="drawer"><rect x="9" y="42" width="52" height="28" fill="#efe8d6" stroke="#151515" stroke-width="2.5"/><rect x="28" y="52" width="14" height="5" fill="#151515"/></g>
    <g class="drawer"><rect x="9" y="74" width="52" height="28" fill="#efe8d6" stroke="#151515" stroke-width="2.5"/><rect x="28" y="84" width="14" height="5" fill="#151515"/></g>
  </svg>`;
const gateSVG = `<svg class="gate" viewBox="0 0 80 120" style="width:74px;height:112px">
    <rect x="4" y="4" width="10" height="112" fill="#151515"/><rect x="66" y="4" width="10" height="112" fill="#151515"/>
    <rect x="4" y="4" width="72" height="10" fill="#151515"/>
    <g class="gate-bars">${[20, 32, 44, 56].map(x => `<rect x="${x}" y="14" width="5" height="98" fill="#4a4640"/>`).join("")}
      <rect x="14" y="40" width="52" height="4" fill="#4a4640"/><rect x="14" y="76" width="52" height="4" fill="#4a4640"/></g>
    <text x="40" y="-4" text-anchor="middle" font-family="Bangers, Impact" font-size="13" fill="#151515">PALIMPSEST</text>
  </svg>`;
const botSVG = `<svg class="bot" viewBox="0 0 70 62">
    <line x1="35" y1="2" x2="35" y2="12" stroke="#151515" stroke-width="3"/><circle cx="35" cy="3" r="3" fill="#c62828"/>
    <rect x="6" y="12" width="58" height="40" rx="8" fill="#fff" stroke="#151515" stroke-width="3"/>
    <circle class="eye" cx="24" cy="30" r="5" fill="#151515"/><circle class="eye" cx="46" cy="30" r="5" fill="#151515"/>
    <path d="M26 42 Q35 46 44 42" fill="none" stroke="#151515" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="24" y="52" width="22" height="7" fill="#151515"/></svg>`;
const puffSVG = `<svg class="puff" viewBox="0 0 90 90"><circle cx="45" cy="45" r="22"/><circle cx="26" cy="36" r="15"/><circle cx="64" cy="34" r="16"/><circle cx="48" cy="22" r="13"/></svg>`;

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const money = v => "$" + Number(v).toLocaleString();

// ---- Strip construction ----
function buildStrip(ep) {
    const gate = ep.mechanism.startsWith("gate");
    const prop = gate ? gateSVG : cabinetSVG;
    return `
    <div class="panel" id="p1"><span class="num">1 · The Plant</span>
      <div class="caption">${esc(ep.black)}</div>
      <div class="scene" id="s1">
        <div id="p1-agent" style="position:absolute;left:-70px;top:74px;transition:left 1.8s linear">${agentSVG("black", "walk")}</div>
        <div class="doc" id="p1-doc" style="left:-30px;top:120px;transition:left 1.8s linear, top 0.5s ease-in, transform 0.5s"></div>
        <div style="position:absolute;right:12px;top:88px" id="p1-prop">${cabinetSVG}</div>
      </div>
      <div class="foot"><div class="doc-card" id="p1-text"></div></div>
    </div>
    <div class="panel" id="p2"><span class="num">2 · ${gate ? "The Gate" : "The Door"}</span>
      <div class="caption">${esc(ep.white)}</div>
      <div class="scene" id="s2">
        <div style="position:absolute;left:8px;top:80px" id="p2-white">${agentSVG("white")}</div>
        <div class="beam" id="p2-beam" style="left:62px;top:98px;width:120px;height:70px"></div>
        <div style="position:absolute;right:${gate ? 40 : 18}px;top:${gate ? 70 : 88}px" id="p2-prop">${prop}</div>
        <div class="doc" id="p2-doc" style="left:92px;top:120px;transition:left 0.9s ease-in, opacity 0.4s"></div>
        <div class="brackets" id="p2-brackets" style="left:74px;top:100px">&lt;document&gt;<br><br><br><br>&lt;/document&gt;</div>
        <div class="stamp" id="p2-stamp" style="left:70px;top:60px"></div>
        <div class="glow" id="p2-glow" style="right:10px;top:50px"></div>
      </div>
      <div class="foot" id="p2-foot"></div>
    </div>
    <div class="panel" id="p3"><span class="num">3 · The Answer</span>
      <div class="bubble q" id="p3-q"></div>
      ${botSVG}
      <div class="model-tag" id="p3-model"></div>
      <div class="bubble a" id="p3-a" style="margin-top:14px"></div>
    </div>
    <div class="panel" id="p4"><span class="num">4 · The Verdict</span>
      <div class="scene" id="s4" style="height:150px;margin-top:26px">
        <div style="position:absolute;left:14px;top:26px" id="p4-black">${agentSVG("black")}</div>
        <div style="position:absolute;right:14px;top:26px" id="p4-white">${agentSVG("white")}</div>
        <div id="p4-puff" style="position:absolute;top:30px"></div>
        <div class="boom" id="p4-boom" style="top:4px"></div>
      </div>
      <div class="verdict-big" id="p4-verdict"></div>
      <div class="rate" id="p4-rate"></div>
      <div class="outcome-bar" id="p4-bar"></div>
      <div class="legend" id="p4-legend"></div>
      <div class="foot" id="p4-note" style="font-weight:700;color:var(--red)"></div>
    </div>`;
}

// ---- Typewriter ----
async function typeInto(el, text, cps = 70, max = 260) {
    const shown = text.length > max ? text.slice(0, max).trimEnd() + "…" : text;
    if (reduced) { el.textContent = shown; return; }
    el.textContent = ""; el.classList.add("cursor");
    for (let i = 0; i < shown.length; i += 2) {
        if (!playing) break;
        el.textContent = shown.slice(0, i + 2);
        await sleep(1000 / cps * 2);
    }
    el.textContent = shown; el.classList.remove("cursor");
}

function on(id) { document.getElementById(id).classList.add("on"); }
function $(id) { return document.getElementById(id); }

// ---- Panel choreography ----
async function panel1(ep) {
    on("p1");
    const agent = $("p1-agent"), doc = $("p1-doc");
    const typing = typeInto($("p1-text"), ep.document, 90, 200);
    await sleep(60);
    agent.style.left = "70px"; doc.style.left = "110px";
    await sleep(1850);
    agent.querySelector(".agent").classList.remove("walk");
    $("p1-prop").querySelector(".cabinet").classList.add("open");
    doc.style.left = "150px"; doc.style.top = "96px"; doc.style.transform = "scale(0.6) rotate(8deg)";
    await sleep(600);
    doc.style.opacity = "0";
    await typing;
}

async function panel2(ep) {
    on("p2");
    const doc = $("p2-doc"), stamp = $("p2-stamp"), glow = $("p2-glow"), foot = $("p2-foot");
    await sleep(400);
    const vals = ep.gate && ep.gate.competing_values
        ? `${ep.gate.competing_values[0].filter(v => v > 1000).map(money).join(", ")} vs the verified ${ep.gate.competing_values[1].map(money).join(", ")}` : "";
    switch (ep.mechanism) {
        case "open_door":
            doc.style.left = "190px"; await sleep(500);
            $("p2-prop").querySelector(".cabinet").classList.add("open");
            glow.textContent = "INDEXED"; glow.style.color = "#c62828"; glow.classList.add("on");
            foot.textContent = "Nothing checks it. The forgery sits in the index next to the real policy.";
            break;
        case "spotlight":
            $("p2-beam").classList.add("on"); await sleep(350);
            $("p2-brackets").classList.add("on"); await sleep(500);
            doc.style.left = "190px";
            glow.textContent = "WRAPPED AS DATA"; glow.style.color = "#1565c0"; glow.classList.add("on");
            foot.textContent = ep.payload === "instruction_injection"
                ? "The hidden orders are now just text inside a data tag."
                : "It goes in wrapped as data. But it gives no orders, so there's nothing to ignore.";
            break;
        case "stamp":
            stamp.textContent = "UNVERIFIED UPLOAD"; stamp.className = "stamp red go"; await sleep(700);
            doc.style.left = "190px";
            foot.textContent = "It still reaches the index, but everyone can see where it came from.";
            break;
        case "stamp_spoofed":
            stamp.textContent = "VERIFIED ✓"; stamp.className = "stamp green go"; await sleep(700);
            doc.style.left = "190px";
            foot.textContent = "Same stamp as the real policy. The label is honest; the door wasn't.";
            break;
        case "grounding":
            doc.style.left = "190px"; await sleep(500);
            $("p2-prop").querySelector(".cabinet").classList.add("open");
            stamp.textContent = "FIGURE VERIFIED ✓"; stamp.className = "stamp green go";
            foot.textContent = "The output check asks one question: does every dollar figure in the answer appear in a verified document? $100,000 does, as the capital expenditure threshold. Right number, wrong fact.";
            break;
        case "gate":
        case "gate_review": {
            if (ep.gate && !ep.gate.quarantined) {
                // The gate ran and found nothing to hold: the forgery walks through
                doc.style.left = "150px"; await sleep(500);
                doc.style.left = "230px";
                stamp.textContent = "NO CONFLICT FOUND"; stamp.className = "stamp green go";
                stamp.style.left = "50px"; stamp.style.top = "44px";
                foot.textContent = ep.gate.relation === "reinforces"
                    ? "Filed as confirming the real rule: it shares the rule's wording and has no number to compare, so the gate counts it as agreement."
                    : "Filed as a one-off exception with no number to compare, so there is nothing to flag. The gate can't read \"removed.\"";
                break;
            }
            doc.style.left = "130px"; await sleep(450);
            $("p2-prop").querySelector(".gate").classList.add("down");
            await sleep(450);
            const review = ep.mechanism === "gate_review" || (ep.gate && ep.gate.review_needed);
            stamp.textContent = review ? "REVIEW NEEDED" : "QUARANTINED";
            stamp.className = "stamp red go"; stamp.style.left = "60px"; stamp.style.top = "44px";
            foot.innerHTML = review
                ? `An exception, not a collision, but it changes the number (${esc(vals)}). It waits for a person.`
                : `A collision: ${esc(vals)} for the same fact. Held until someone resolves it.`;
            break;
        }
    }
    await sleep(700);
}

async function panel3(ep) {
    on("p3");
    if (ep.livePending) {
        const a = $("p3-a");
        $("p3-model").innerHTML = `${esc(ep.liveModel)} is answering live`;
        a.textContent = "Thinking"; a.classList.add("thinking");
        ep.live = await ep.livePending;
        a.classList.remove("thinking");
    }
    if (ep.live && !ep.live.error) {
        const L = ep.live;
        $("p3-model").innerHTML = `${esc(L.model)} answers <span class="live-tag">LIVE</span>`;
        await typeInto($("p3-q"), L.query, 80);
        await sleep(250);
        const a = $("p3-a");
        a.classList.toggle("adopted", L.adopted);
        const text = L.blocked ? "[Blocked by the grounding check: the answer states a figure no verified document contains]" : L.answer;
        await typeInto(a, text, 110, 240);
        await sleep(400);
        return;
    }
    if (ep.live && ep.live.error) $("p3-model").textContent = `Live run failed (${ep.live.error}); showing the battery's answer`;
    const s = ep.sample;
    if (!ep.live) $("p3-model").textContent = s ? `${s.model} answers` : "";
    await typeInto($("p3-q"), s ? s.query : "(no answer recorded)", 80);
    await sleep(250);
    const a = $("p3-a");
    a.classList.toggle("adopted", s && s.outcome === "ADOPTED_FORGED");
    await typeInto(a, s ? s.answer : "", 110, 240);
    await sleep(400);
}

const OUTCOME_COLORS = { ADOPTED_FORGED: "#c62828", CONFLICT: "#f2c14e", TRUE: "#2e7d32", NO_FIGURE: "#b8b0a0", BLOCKED: "#4a4640" };
const OUTCOME_NAMES = { ADOPTED_FORGED: "took the forgery", CONFLICT: "flagged the conflict", TRUE: "gave the true $10,000", NO_FIGURE: "no figure", BLOCKED: "blocked" };

async function panel4(ep) {
    on("p4");
    const liveOk = ep.live && !ep.live.error;
    const blackWins = liveOk ? ep.live.adopted : ep.winner === "black";
    const winner = $(blackWins ? "p4-black" : "p4-white"), loser = $(blackWins ? "p4-white" : "p4-black");
    const puffHost = $("p4-puff");
    puffHost.innerHTML = puffSVG;
    puffHost.style.left = blackWins ? "auto" : "0px"; puffHost.style.right = blackWins ? "0px" : "auto";
    const boom = $("p4-boom");
    boom.textContent = blackWins ? "FOOLED!" : "FOILED!";
    boom.style.left = blackWins ? "auto" : "10px"; boom.style.right = blackWins ? "10px" : "auto";
    await sleep(300);
    puffHost.querySelector(".puff").classList.add("go");
    boom.classList.add("go");
    await sleep(350);
    loser.querySelector(".agent").classList.add("sooty");
    winner.querySelector(".agent").classList.add("cheer");
    const v = $("p4-verdict");
    v.className = "verdict-big " + (blackWins ? "black" : "white");
    v.textContent = (blackWins ? "Black Hat wins" : "White Hat wins") + (liveOk ? " this round" : "");
    const pct = Math.round(ep.adoption * 100);
    $("p4-rate").innerHTML = liveOk
        ? `This live answer <b>${ep.live.adopted ? "took" : "did not take"}</b> ${esc(ep.planted || "the forgery")}.<br>`
          + `Battery: <b>${pct}%</b> of ${ep.answers} answers took it (${MODELS.length} models).`
        : `<b>${pct}%</b> of ${ep.answers} answers took ${esc(ep.planted || "the forgery")}<br>(${MODELS.length} models × ${ep.answers / MODELS.length} questions)`;
    const bar = $("p4-bar"), order = ["ADOPTED_FORGED", "CONFLICT", "TRUE", "NO_FIGURE", "BLOCKED"];
    bar.innerHTML = order.filter(o => ep.outcomes[o]).map(o => `<span data-w="${ep.outcomes[o] / ep.answers * 100}" style="background:${OUTCOME_COLORS[o]}" title="${OUTCOME_NAMES[o]}"></span>`).join("");
    await sleep(40);
    bar.querySelectorAll("span").forEach(s => s.style.width = s.dataset.w + "%");
    $("p4-legend").innerHTML = order.filter(o => ep.outcomes[o]).map(o =>
        `<span><i style="background:${OUTCOME_COLORS[o]}"></i>${OUTCOME_NAMES[o]} ${Math.round(ep.outcomes[o] / ep.answers * 100)}%</span>`).join("");
    $("p4-note").textContent = liveOk ? "" : (ep.note || "");
    if (!liveOk && !scored.has(ep.number)) {
        scored.add(ep.number);
        score[ep.winner] += 1;
        $("score-" + ep.winner).textContent = score[ep.winner];
        const t = $("tally-" + ep.winner); t.classList.remove("bump"); void t.offsetWidth; t.classList.add("bump");
    }
    renderChips();
    await sleep(1400);
}

async function playEpisode(i, liveModel = null) {
    const token = ++playing;
    current = i;
    const ep = { ...EPISODES[i] };
    if (liveModel) {
        // Start the live generation now; the plant animation plays while it runs
        ep.liveModel = liveModel;
        ep.livePending = fetch(`${API_BASE}/api/episodes/live`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ number: ep.number, model: liveModel }),
        }).then(r => r.json()).catch(e => ({ error: e.message }));
    }
    $("cliff").classList.remove("on");
    $("ep-title").innerHTML = `Episode ${ep.number}: ${esc(ep.title)} <small>${esc(ep.payload.replace(/_/g, " "))} vs ${esc(ep.defense.replace(/_/g, " "))}</small>`;
    $("strip").innerHTML = buildStrip(ep);
    renderChips();
    for (const step of [panel1, panel2, panel3, panel4]) {
        if (playing !== token) return false;
        // Gate episodes show the live gate's own verdict, so wait for it before the gate panel
        if (step === panel2 && ep.livePending && ep.mechanism.startsWith("gate")) {
            ep.live = await ep.livePending; ep.livePending = null;
            if (ep.live && !ep.live.error && ep.live.gate) ep.gate = ep.live.gate;
        }
        await step(ep);
    }
    return playing === token;
}

async function playLive() {
    const model = $("live-model").value;
    if (!model) return;
    $("btn-live").disabled = true;
    try { await playEpisode(current, model); } finally { $("btn-live").disabled = false; }
}

async function loadLiveModels() {
    try {
        const body = await (await fetch(`${API_BASE}/api/models`)).json();
        const usable = (body.models || []).filter(m => m.fits).map(m => m.name);
        $("live-model").innerHTML = usable.map(m => `<option>${esc(m)}</option>`).join("");
        $("live-model").value = usable.find(m => m.startsWith("llama3")) || usable[0] || "";
        if (!usable.length) throw new Error("no models");
    } catch (e) {
        $("live-model").style.display = "none"; $("btn-live").style.display = "none";
    }
}

async function playAll() {
    $("btn-play").disabled = true;
    for (let i = current; i < EPISODES.length; i++) {
        if (!(await playEpisode(i))) break;
        await sleep(900);
        if (i === EPISODES.length - 1) showCliff();
    }
    $("btn-play").disabled = false;
}

function next() {
    if (current < EPISODES.length - 1) playEpisode(current + 1);
    else showCliff();
}

function showCliff() {
    if (!CLIFF) return;
    playing++;
    const c = $("cliff");
    c.innerHTML = `<h2>${esc(CLIFF.title)}…</h2>
        <div style="display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center">
          <div style="width:70px">${agentSVG("black", "walk")}</div>
          <div><p style="margin:0 0 6px;font-weight:700">${esc(CLIFF.black)}</p><p style="margin:0">${esc(CLIFF.white)}</p>
          <p style="margin:8px 0 0;color:var(--red);font-weight:700">${esc(CLIFF.note)} <a href="/" style="color:var(--red)">Open the dashboard</a></p></div>
        </div>`;
    c.classList.add("on");
    $("ep-title").textContent = "To be continued";
    c.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "center" });
}

function renderChips() {
    $("chips").innerHTML = EPISODES.map((ep, i) => {
        const cls = ["chip", i === current ? "active" : "", scored.has(ep.number) ? "won-" + ep.winner : ""].join(" ");
        return `<button class="${cls}" onclick="playEpisode(${i})" title="${esc(ep.payload)} vs ${esc(ep.defense)}">${ep.number}. ${esc(ep.title)}</button>`;
    }).join("") + (CLIFF ? `<button class="chip pending" onclick="showCliff()">?. To be continued</button>` : "");
}

async function load() {
    try {
        const data = await (await fetch(`${API_BASE}/api/episodes`)).json();
        if (!data.episodes || !data.episodes.length) throw new Error(data.error || "no episodes");
        EPISODES = data.episodes; CLIFF = data.cliffhanger; MODELS = data.models;
        $("fine").innerHTML = `Win rates are the share of answers that adopted the forged limit, across ${MODELS.length} local models
            (${MODELS.map(esc).join(", ")}) and 4 procurement questions each, as labeled by a judge model. Black Hat wins an episode
            when half or more of the answers took the forgery. The quoted answer is a real one from the run${data.run ? ` of ${esc(data.run.slice(0, 10))}` : ""}.
            <b>Run live</b> replays the episode now: same forgery, same retrieval, same defense, a fresh answer from the model you pick,
            scored with a quick check for the planted claim (the battery uses a judge model).
            Characters are original, in the spirit of classic cartoon spy rivalries: neither side ever wins for good.`;
        renderChips();
        // ?ep=N starts at episode N (links, demos, screenshots)
        const start = parseInt(new URLSearchParams(location.search).get("ep") || "1", 10) - 1;
        playEpisode(Math.min(Math.max(start, 0), EPISODES.length - 1));
    } catch (e) {
        $("ep-title").textContent = `Could not load episodes: ${e.message}`;
    }
}
load();
loadLiveModels();
</script>

</html>
